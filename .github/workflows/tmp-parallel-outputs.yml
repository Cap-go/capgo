name: TMP parallel outputs check
on:
  pull_request:
    paths:
      - .github/workflows/tmp-parallel-outputs.yml
permissions: {}
jobs:
  produce:
    runs-on: ubuntu-latest
    outputs:
      a: ${{ steps.a.outputs.value }}
      b: ${{ steps.b.outputs.value }}
      multi: ${{ steps.b.outputs.multi }}
    steps:
      - parallel:
          - name: A
            id: a
            run: sleep 5; echo "value=alpha" >> "$GITHUB_OUTPUT"
          - name: B
            id: b
            continue-on-error: true
            run: |
              echo "value=beta" >> "$GITHUB_OUTPUT"
              { echo "multi<<EOF"; echo "line1"; echo "line2"; echo "EOF"; } >> "$GITHUB_OUTPUT"
              exit 1
      - run: test "${{ steps.a.outputs.value }}" = alpha && test "${{ steps.b.outputs.value }}" = beta && echo "step outputs ok; b outcome=${{ steps.b.outcome }} conclusion=${{ steps.b.conclusion }}"
  consume:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.produce.outputs.a }}" = alpha
          test "${{ needs.produce.outputs.b }}" = beta
          printf '%s\n' "${{ needs.produce.outputs.multi }}"
